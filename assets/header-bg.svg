<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180">
  <defs>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.14"/>
    </pattern>
    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="12%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="88%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1000" height="180" fill="#000000"/>
  <rect x="0" y="0" width="1000" height="180" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1000" height="180" fill="url(#edgeFade)"/>

  <!-- moving scanline -->
  <rect x="0" y="-40" width="1000" height="40" fill="url(#scanFade)">
    <animate attributeName="y" values="-40;180" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- large faint terminal glyph -->
  <text x="860" y="120" font-family="JetBrains Mono, monospace" font-size="90" fill="#ffffff" opacity="0.05">&gt;_</text>

  <!-- status indicators -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#ffffff">
    <circle cx="34" cy="148" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="148" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="148" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="152" opacity="0.55">system.online</text>
  </g>

  <!-- corner tick marks -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.35">
    <path d="M 20 20 L 20 34 M 20 20 L 34 20"/>
    <path d="M 980 20 L 980 34 M 980 20 L 966 20"/>
    <path d="M 20 160 L 20 146 M 20 160 L 34 160"/>
    <path d="M 980 160 L 980 146 M 980 160 L 966 160"/>
  </g>

  <!-- base border -->
  <rect x="0" y="177" width="1000" height="2" fill="#ffffff" opacity="0.25"/>
</svg>
